name: "melhorias"
version: "1.0.0"
config-version: 2

profile: "melhorias"

# Logs do dbt vao pro stdout (capturado no log da task do Airflow); 'none' desliga a
# escrita de logs/dbt.log.
flags:
  log_level_file: none

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ADR 0001: tudo materializado como VIEW em dbo (limite de 10GB, Power BI import).
models:
  melhorias:
    +materialized: view
    +schema: dbo
    staging:
      +tags: ["staging"]
    intermediate:
      +tags: ["intermediate"]
    marts:
      +tags: ["marts"]

# Seed desativado: tabelas mel_* carregadas manualmente no SQL Server (ADR 0004).
# Config mantida comentada como referencia. NAO usar +enabled: false aqui: os models
# referenciam os seeds via ref() e isso quebraria o parse; os nos seguem habilitados
# para resolucao de ref(), o build apenas os exclui (--exclude resource_type:seed).
# seeds:
#   melhorias:
#     +schema: dbo
